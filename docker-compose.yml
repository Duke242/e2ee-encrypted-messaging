# Local stack: PostgreSQL + the Spring Boot API.
# Usage: JWT_SECRET=$(openssl rand -base64 64 | tr -d '\n') docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: secure_chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d secure_chat"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/secure_chat
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Required. The API refuses to start without a base64 key of at least 64 bytes.
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"

volumes:
  db-data:
