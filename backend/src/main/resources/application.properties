# Every secret and environment-specific value comes from an environment variable.
# JWT_SECRET has no usable default on purpose: JwtTokenUtil refuses to start without a strong one.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/secure_chat}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

server.port=${PORT:8080}
server.error.include-message=always

# Base64-encoded HS512 key, at least 64 bytes once decoded.
jwt.secret=${JWT_SECRET:}
jwt.expirationMs=${JWT_EXPIRATION_MS:3600000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

logging.level.com.example.demo=${LOG_LEVEL:INFO}
