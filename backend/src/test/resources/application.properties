# Test configuration: an in-memory H2 database in PostgreSQL mode, so tests need no running database.
spring.datasource.url=jdbc:h2:mem:securechat;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Test-only key (base64 of 64 fixed bytes). Never used outside tests.
jwt.secret=dGVzdC1vbmx5LWp3dC1zZWNyZXQtZm9yLWp1bml0LXRlc3RzLW5vdC1mb3ItcHJvZHVjdGlvbi11c2UtMDEyMzQ1Njc4OQ==
jwt.expirationMs=3600000

app.cors.allowed-origins=http://localhost:5173

management.endpoints.web.exposure.include=health
