name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (JUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run unit and integration tests
        run: mvn -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports

  frontend-build:
    name: Frontend build (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker-smoke-test:
    name: Docker image + smoke test
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL and the API
        run: |
          export JWT_SECRET="$(openssl rand -base64 64 | tr -d '\n')"
          docker compose up -d --build
      - name: Wait for the API health check
        run: |
          for i in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q api)")
            [ "$status" = "healthy" ] && exit 0
            sleep 3
          done
          docker compose logs api
          exit 1
      - name: Smoke test the API
        run: |
          curl -fsS localhost:8080/actuator/health
          curl -fsS -X POST localhost:8080/api/auth/signup \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-1","publicKey":"ci-key"}' > signup.json
          grep -q '"token"' signup.json
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/profiles)
          [ "$code" = "401" ] || { echo "expected 401 without a token, got $code"; exit 1; }
      - name: Stop the stack
        if: always()
        run: docker compose down -v
